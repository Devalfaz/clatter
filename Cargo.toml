[package]
name = "clatter"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Satisfying mechanical keyboard sounds for Windows"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
cpal = "0.18"
rtrb = "0.4"
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis", "wav", "pcm", "mp3", "flac", "adpcm"] }
zip = { version = ">=2, <10", default-features = false, features = ["deflate"] }
slint = { version = "1.16", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"
tray-icon = "0.26"
global-hotkey = "0.10"
rfd = ">=0.14, <0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
dirs = "6"
log = "0.4"
hound = "3.5"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_Security",
]

[build-dependencies]
slint-build = "1.16"
embed-resource = "3"
ico = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
